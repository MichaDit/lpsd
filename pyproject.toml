[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpsd"
version = "1.0.6+fast.1"
description = "LPSD spectral estimation with an optional parallel native implementation"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "lpsd_fast/_native/LICENSE.numpy.txt"]
authors = [
    {name = "Christoph Bode", email = "christoph.bode@aei.mpg.de"},
    {name = "Gerhard Heinzel"},
    {name = "Christian Darsow-Fromm", email = "cdarsowf@physnet.uni-hamburg.de"},
    {name = "Artem Basalaev", email = "artem.basalaev@physikDOTuni-hamburg.de"},
]
dependencies = ["numpy>=1.24,<3", "pandas>=1.5,<3", "scipy>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]
dev = ["build>=1", "black>=25", "isort>=6", "mypy>=1.9", "pylint>=3", "pre-commit>=4", "pytest-watch>=4"]

[project.urls]
Repository = "https://github.com/MichaDit/lpsd"
Upstream = "https://gitlab.com/uhh-gwd/lpsd"

[tool.setuptools.packages.find]
include = ["lpsd", "lpsd.*", "lpsd_fast", "lpsd_fast.*"]

[tool.setuptools.package-data]
lpsd = ["*.c", "*.h", "c_sources/*.c", "c_sources/*.h"]
lpsd_fast = ["_native/*.c", "_native/*.h", "_native/LICENSE*", "_native/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["test", "test_fast"]

[tool.coverage.run]
source = ["lpsd"]

[tool.coverage.report]
fail_under = 60

[tool.coverage.html]
directory = "htmlcov"

[tool.isort]
profile = "black"
line_length = 88
