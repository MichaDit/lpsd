name: Portable benchmark bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, os: ubuntu-24.04}
          - {name: linux-arm64, os: ubuntu-24.04-arm}
          - {name: macos-arm64, os: macos-15}
          - {name: windows-x64, os: windows-2025}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GH_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fresh private POSIX bootstrap and numerical smoke
        if: runner.os != 'Windows'
        env:
          LPSD_BENCHMARK_BASE_DIR: ${{ runner.temp }}
        shell: bash
        run: >-
          sh scripts/run_benchmark.sh --revision "$GITHUB_SHA"
          --source-dir "$GITHUB_WORKSPACE" --max-hours 0.25
          --sizes 100000 --threads 2 --storage both --profile performance --compiler zig
      - name: Fresh private PowerShell bootstrap and numerical smoke
        if: runner.os == 'Windows'
        env:
          LPSD_BENCHMARK_BASE_DIR: ${{ runner.temp }}
        shell: pwsh
        run: |
          & ./test_fast/check_bootstrap_budget.ps1
          & ./scripts/run_benchmark.ps1 -Revision $env:GITHUB_SHA -BenchmarkArgs @('--source-dir', $env:GITHUB_WORKSPACE, '--max-hours', '0.25', '--sizes', '100000', '--threads', '2', '--storage', 'both', '--profile', 'performance', '--compiler', 'zig')
      - name: Require all methods and both actual point counts on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Each fresh environment contains its own Python; no setup-python or
          # preinstalled scientific stack is part of this bootstrap gate.
          reports=("$RUNNER_TEMP"/lpsd-benchmark*/results.json)
          test "${#reports[@]}" -eq 1
          report="${reports[0]}"
          test -f "$report"
          directory=$(dirname "$report")
          if [ -f "$directory/venv/Scripts/python.exe" ]; then
            python_bin="$directory/venv/Scripts/python.exe"
          else
            python_bin="$directory/venv/bin/python"
          fi
          "$python_bin" test_fast/check_portable_smoke.py "$report"
          # Exercise the memory-saving route explicitly on every platform;
          # the normal small bootstrap above correctly selects a full window.
          cd "$directory/source"
          "$python_bin" -m lpsd_benchmark run --sizes 100000 --threads 2 --storage both --smoothing-workers 8 --profile performance --max-hours 0.10 --window-storage fft_input_then_blocked --output "$directory/bounded-results.json"
          "$python_bin" "$GITHUB_WORKSPACE/test_fast/check_portable_smoke.py" "$directory/bounded-results.json" fft_input_then_blocked 8
          "$python_bin" benchmarks/bench_disk_algorithms.py --sizes 100000 1000000 --threads 2 --repeats 3 --point-factors 1 2 --max-seconds 600 --output "$directory/disk-algorithm-pairs.json"
          "$python_bin" benchmarks/bench_disk_algorithms.py --compare-packed-phase --sizes 1000000 --threads 2 --repeats 3 --point-factors 1 2 --max-seconds 300 --output "$directory/packed-phase-pairs.json"
          "$python_bin" "$GITHUB_WORKSPACE/test_fast/check_direct_power_smoke.py" --source-root "$directory/source" --output "$directory/direct-power-smoke.json"
      - name: Require all methods and both actual point counts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path "$env:RUNNER_TEMP/lpsd-benchmark*/results.json" -File)
          if ($reports.Count -ne 1) { throw 'Expected one fresh benchmark report' }
          $python = Join-Path $reports[0].DirectoryName 'venv/Scripts/python.exe'
          & $python test_fast/check_portable_smoke.py $reports[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete bootstrap comparison' }
          $boundedReport = Join-Path $reports[0].DirectoryName 'bounded-results.json'
          $diskReport = Join-Path $reports[0].DirectoryName 'disk-algorithm-pairs.json'
          $phaseReport = Join-Path $reports[0].DirectoryName 'packed-phase-pairs.json'
          $directReport = Join-Path $reports[0].DirectoryName 'direct-power-smoke.json'
          $deviceTestReport = Join-Path $reports[0].DirectoryName 'device-regressions.xml'
          $memoryProbe = @'
          import sys
          from lpsd_fast._resources import host_available_memory
          from lpsd_benchmark.resources import system_memory
          assert sys.platform == "win32"
          available = host_available_memory()
          total, _ = system_memory()
          if type(available) is not int or not 0 < available <= total < 2**60:
              raise RuntimeError("Native Windows available-memory query failed")
          print("Native Windows available-memory query passed without fallback")
          '@
          Push-Location (Join-Path $reports[0].DirectoryName 'source')
          try {
            $memoryProbe | & $python -
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows RAM query failed' }
            & $python -m lpsd_benchmark run --sizes 100000 --threads 2 --storage both --smoothing-workers 8 --profile performance --max-hours 0.10 --window-storage fft_input_then_blocked --output $boundedReport
            if ($LASTEXITCODE -ne 0) { throw 'Bounded window smoke failed' }
            & $python benchmarks/bench_disk_algorithms.py --sizes 100000 1000000 --threads 2 --repeats 3 --point-factors 1 2 --max-seconds 600 --output $diskReport
            if ($LASTEXITCODE -ne 0) { throw 'Packed real FFT comparison failed' }
            & $python benchmarks/bench_disk_algorithms.py --compare-packed-phase --sizes 1000000 --threads 2 --repeats 3 --point-factors 1 2 --max-seconds 300 --output $phaseReport
            if ($LASTEXITCODE -ne 0) { throw 'Packed phase comparison failed' }
            & $python "$env:GITHUB_WORKSPACE/test_fast/check_direct_power_smoke.py" --source-root (Join-Path $reports[0].DirectoryName 'source') --output $directReport
            if ($LASTEXITCODE -ne 0) { throw 'Direct log-power correctness smoke failed' }
            # The physical-device reports found Windows-specific archive/path
            # regressions. Exercise those contracts in this actual private
            # Windows environment after all performance observations finish.
            $uv = @(Get-ChildItem -LiteralPath (Join-Path $reports[0].DirectoryName 'uv') -Filter uv.exe -Recurse -File)
            if ($uv.Count -ne 1) { throw 'Expected exactly one private uv executable' }
            & $uv[0].FullName --no-config --no-cache pip install --python $python 'pytest>=8'
            if ($LASTEXITCODE -ne 0) { throw 'Windows regression prerequisites failed' }
            $nativeTestSetup = @'
          import json, shlex
          from pathlib import Path
          from benchmarks import bench_fftw
          from lpsd_benchmark.worker import _load_fftw
          from lpsd_fast import api
          api._native()
          build = json.loads(Path(api._LIB._name).with_suffix(".build.json").read_text())
          print(json.dumps({"fftw_library": _load_fftw(bench_fftw, 1).lib._name,
                            "compiler": shlex.join(build["compiler"])}))
          '@
            $privateToolchainJson = & $python -c $nativeTestSetup
            if ($LASTEXITCODE -ne 0) { throw 'Private native test toolchain lookup failed' }
            $privateToolchain = $privateToolchainJson | ConvertFrom-Json -ErrorAction Stop
            $env:LPSD_TEST_FFTW_LIBRARY = $privateToolchain.fftw_library
            $env:CC = $privateToolchain.compiler
            & $python -m pytest -o addopts='' -q test_fast/test_bootstrap.py test_fast/test_bootstrap_memory_tree.py test_fast/test_portable_diagnostics.py test_fast/test_statistics.py test_fast/test_smoothing_controls.py test_fast/test_csd_batches.py test_fast/test_csd_extreme_fallback.py test_fast/test_matched_smoothing.py --junitxml $deviceTestReport
            if ($LASTEXITCODE -ne 0) { throw 'Windows device regression contracts failed' }
            $deviceGate = @'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          groups = (
              ("corrected statistics", 103, True, lambda c: c.get("classname", "").endswith("test_statistics")),
              ("failure and thread diagnostics", 15, True, lambda c: c.get("classname", "").endswith("test_portable_diagnostics")),
              ("frozen estimator comparisons", 24, False, lambda c: c.get("name", "").startswith("test_all_six_signals_match_frozen_estimator[")),
              ("Bluestein comparison", 1, False, lambda c: c.get("name") == "test_measured_bluestein_hybrid_retains_original_density"),
              ("CSD fallback route", 28, False, lambda c: c.get("classname", "").endswith("test_csd_extreme_fallback")),
          )
          for label, count, minimum, match in groups:
              selected = [case for case in cases if match(case)]
              wrong_count = len(selected) < count if minimum else len(selected) != count
              if wrong_count or any(len(case) for case in selected):
                  raise RuntimeError(f"{label}: expected {'at least ' if minimum else ''}{count} executed, passing tests")
              print(f"{label}: {len(selected)} executed and passed")
          '@
            & $python -c $deviceGate $deviceTestReport
            if ($LASTEXITCODE -ne 0) { throw 'Windows numerical tests were not executed completely' }
          } finally { Pop-Location }
          & $python test_fast/check_portable_smoke.py $boundedReport fft_input_then_blocked 8
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete bounded window comparison' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: portable-smoke-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/lpsd-benchmark*/bootstrap-local.json
            ${{ runner.temp }}/lpsd-benchmark*/results.json
            ${{ runner.temp }}/lpsd-benchmark*/results.public.json
            ${{ runner.temp }}/lpsd-benchmark*/bounded-results.json
            ${{ runner.temp }}/lpsd-benchmark*/bounded-results.public.json
            ${{ runner.temp }}/lpsd-benchmark*/disk-algorithm-pairs.json
            ${{ runner.temp }}/lpsd-benchmark*/packed-phase-pairs.json
            ${{ runner.temp }}/lpsd-benchmark*/direct-power-smoke.json
            ${{ runner.temp }}/lpsd-benchmark*/device-regressions.xml
            ${{ runner.temp }}/lpsd-benchmark*/source/lpsd/*.build.json
            ${{ runner.temp }}/lpsd-benchmark*/source/lpsd_fast/_native/*.build.json
