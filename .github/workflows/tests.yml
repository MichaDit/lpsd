name: Native tests and wheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LPSD_NATIVE: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  numerical:
    name: Numerical / ${{ matrix.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64-gcc, os: ubuntu-24.04, cc: gcc, architecture: x64, machine: x86_64, python: "3.10", benchmark: false}
          - {name: linux-x64-gcc, os: ubuntu-24.04, cc: gcc, architecture: x64, machine: x86_64, python: "3.12", benchmark: true}
          - {name: linux-x64-clang, os: ubuntu-24.04, cc: clang, architecture: x64, machine: x86_64, python: "3.12", benchmark: false}
          - {name: linux-arm64-gcc, os: ubuntu-24.04-arm, cc: gcc, architecture: arm64, machine: aarch64, python: "3.12", benchmark: true}
          - {name: macos-arm64-clang, os: macos-15, cc: clang, architecture: arm64, machine: arm64, python: "3.12", benchmark: true}
    env:
      CC: ${{ matrix.cc }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Verify native architecture and compiler
        run: |
          python -c 'import os,platform; print(platform.platform()); assert platform.machine() == os.environ["EXPECTED_MACHINE"]'
          "$CC" --version
          "$CC" -dumpmachine
      - name: Inventory exposed accelerator prerequisites
        run: |
          mkdir -p benchmark-results
          python benchmarks/probe_accelerators.py --inventory-only --probe-commands --timeout 15 > benchmark-results/accelerators.json
          cat benchmark-results/accelerators.json
      - name: Install package and test dependencies
        run: python -m pip install '.[test]'
      - name: Build both source-tree C backends
        run: make compile
      - name: Install optional FFTW comparison dependency
        if: matrix.name == 'linux-x64-gcc' && matrix.python == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfftw3-double3
      - name: Require complete FFTW adapter coverage
        if: matrix.name == 'linux-x64-gcc' && matrix.python == '3.12'
        run: |
          python -m pytest -o addopts='' -q test_fast/test_fftw_benchmark.py test_fast/test_fftw_pipeline_ops.py test_fast/test_matched_smoothing.py test_fast/test_fftw_bluestein.py --junitxml=test-results/fftw.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("test-results/fftw.xml").getroot(); n=sum(int(s.get("tests",0)) for s in r.iter("testsuite")); skipped=sum(int(s.get("skipped",0)) for s in r.iter("testsuite")); assert n >= 150 and skipped == 0, (n,skipped)'
      - name: Optimized implementation regression tests
        run: python -m pytest -o addopts='' -q -ra test_fast --junitxml=test-results/fast.xml
      - name: Original upstream tests
        run: python -m pytest -o addopts='' -q -ra test --junitxml=test-results/upstream.xml
      - name: Small wall-time and phase comparison on native hardware
        if: matrix.benchmark
        run: python benchmarks/ci_architecture.py --n 100000 --output-directory benchmark-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: results-${{ matrix.name }}-python-${{ matrix.python }}
          path: |
            test-results/*.xml
            benchmark-results/*.json
            lpsd/*.build.json
            lpsd_fast/_native/*.build.json

  wheel:
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, os: ubuntu-24.04, cc: gcc, architecture: x64, machine: x86_64}
          - {name: linux-arm64, os: ubuntu-24.04-arm, cc: gcc, architecture: arm64, machine: aarch64}
          - {name: macos-arm64, os: macos-15, cc: clang, architecture: arm64, machine: arm64}
    env:
      CC: ${{ matrix.cc }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Verify native architecture
        run: python -c 'import os,platform; assert platform.machine() == os.environ["EXPECTED_MACHINE"]'
      - name: Inventory exposed accelerator prerequisites
        run: |
          mkdir -p benchmark-results
          python benchmarks/probe_accelerators.py --inventory-only --probe-commands --timeout 15 > benchmark-results/accelerators.json
          cat benchmark-results/accelerators.json
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/lpsd-wheel-smoke"
          "$RUNNER_TEMP/lpsd-wheel-smoke/bin/python" -m pip install dist/*.whl
      - name: Exercise installed native libraries outside checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/lpsd-wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/test_fast/wheel_smoke.py"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: accelerator-inventory-wheel-${{ matrix.name }}
          path: benchmark-results/accelerators.json
